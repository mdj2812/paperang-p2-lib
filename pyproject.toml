[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperang-p2-lib"
version = "0.1.0"
description = "Python library for Paperang P2 thermal printer (USB protocol)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "pyusb>=1.2.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
qr = ["qrcode[pil]>=7.4.2"]
cjk = []  # Bundled wqy-microhei CJK font

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperang = [
    "profiles.json",
    "fonts/latin/*.ttf",
    "fonts/cjk/*.ttc",
]
