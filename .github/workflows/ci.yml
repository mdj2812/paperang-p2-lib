name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python3 -m pip install ruff

      - name: Run ruff
        run: ruff check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install pytest pytest-cov

      - name: Install package with extras
        run: python3 -m pip install ".[qr]"

      - name: Run tests with coverage
        run: |
          python3 -m pytest tests/ -v --cov=src/paperang --cov-report=xml:coverage.xml --cov-report=term
          echo "=== coverage.xml head ==="
          head -30 coverage.xml

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both
          indicators: true

      - name: Import test
        run: python3 -c "from paperang import PaperangP2; print('Import OK')"

  test-cjk:
    name: Test (with [cjk])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install pytest pytest-cov

      - name: Install fonts-cjk from PyPI
        run: python3 -m pip install paperang-p2-fonts-cjk

      - name: Install paperang-p2-lib with [cjk]
        run: python3 -m pip install ".[cjk,qr]"

      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Verify CJK fonts detected
        run: python3 -c "from paperang import BUNDLED_FONTS_CJK; assert len(BUNDLED_FONTS_CJK) > 0, 'CJK fonts not found!'; print('CJK fonts OK:', BUNDLED_FONTS_CJK)"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python3 -m pip install --upgrade pip build

      - name: Build
        run: python3 -m build
